name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Тесты и покрытие
    runs-on: ubuntu-latest
    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Установить JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: temurin
          cache: maven

      - name: Прогнать тесты и собрать отчёт JaCoCo
        run: mvn -B verify

      - name: Сводка по покрытию
        if: always()
        run: |
          REPORT=target/site/jacoco/jacoco.csv
          [ -f "$REPORT" ] || exit 0
          {
            echo "### Покрытие JaCoCo"
            echo
            echo "| Класс | Строки | Ветки | Методы |"
            echo "|-------|--------|-------|--------|"
            awk -F, 'NR > 1 {
              printf "| `%s` | %d/%d | %d/%d | %d/%d |\n", \
                $3, $9, $8 + $9, $7, $6 + $7, $13, $12 + $13
            }' "$REPORT"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Сохранить отчёт как артефакт сборки
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: error

      - name: Подготовить отчёт для GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/site/jacoco

  deploy:
    name: Опубликовать отчёт на GitHub Pages
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Развернуть на Pages
        id: deployment
        uses: actions/deploy-pages@v4
